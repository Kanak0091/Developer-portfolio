      <stop offset="50%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <linearGradient id="sunsetWave" x1="0" y1="130" x2="1000" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FF6B35" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0.95" />
