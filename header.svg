  </defs>

  <rect width="1000" height="210" rx="14" fill="url(#midnightBg)" />
  <path d="M0 145 Q 260 95, 520 148 T 1000 130 L 1000 210 L 0 210 Z" fill="url(#blueWave)" />
  <path d="M0 160 Q 320 190, 640 140 T 1000 155 L 1000 210 L 0 210 Z" fill="url(#sunsetWave)" />
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#electricSunsetLine)" />

  <text x="500" y="64" text-anchor="middle" fill="#00D4FF" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="12" font-weight="700" letter-spacing="3">PORTFOLIO INDEX // K.R. MANGALAM UNIVERSITY</text>
  <text x="500" y="106" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5">Kanak Sachin Chaudhary</text>
  <text x="500" y="136" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.4">BCA (AI &amp; Data Science) • Python, Linux, Web Development &amp; Data Analytics</text>

  <rect x="0.5" y="0.5" width="999" height="209" rx="14" stroke="#1E293B" stroke-width="1" />
