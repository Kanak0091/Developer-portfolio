      <stop offset="0%" stop-color="#05070E" />
      <stop offset="50%" stop-color="#0A1024" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="electricSunsetLine" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
